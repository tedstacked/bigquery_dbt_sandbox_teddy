version: 2

unit_tests:
  # Expected: FAIL on Fusion (dbt1308 schema fetch of a non-existent relation),
  # PASS on dbt Core (derives columns from compiled SQL via an empty temp table).
  - name: ut_repro_no_override
    model: fct_repro_incremental
    given:
      - input: ref('stg_repro_input')
        rows:
          - {id: 1, val: 'a'}
          - {id: 2, val: 'b'}
    expect:
      rows:
        - {id: 1, val: 'a'}
        - {id: 2, val: 'b'}

  # Expected: PASS on Fusion 2.0.1+ (fs#12709 infers columns from compiled SQL
  # for the is_incremental:false branch). On pre-fix builds it still fails.
  - name: ut_repro_with_override
    model: fct_repro_incremental
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_repro_input')
        rows:
          - {id: 1, val: 'a'}
          - {id: 2, val: 'b'}
    expect:
      rows:
        - {id: 1, val: 'a'}
        - {id: 2, val: 'b'}
